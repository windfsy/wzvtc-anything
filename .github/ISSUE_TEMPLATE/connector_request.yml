name: Connector request
description: Request a new campus system connector
title: "[connector] "
labels: ["connector"]
body:
  - type: input
    id: system
    attributes:
      label: System
      description: e.g. library, 一表通, sports venue
    validations:
      required: true
  - type: textarea
    id: auth
    attributes:
      label: Auth method
      description: CAS / WeChat link-code / account-password / other; do not include credentials
    validations:
      required: true
  - type: textarea
    id: capabilities
    attributes:
      label: Desired read/write capabilities
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Risks and compliance
      description: Third-party platform, write operations, rate limits, PII
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirm
      options:
        - label: I did not include credentials, tokens, or real personal data.
          required: true
