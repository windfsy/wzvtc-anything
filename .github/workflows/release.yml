name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Ensure package is publishable
        run: node -e "const p=require('./package.json'); if(p.private){console.error('Remove private before releasing');process.exit(1)}"
      - run: pnpm release:check
      - name: Determine npm dist-tag
        id: dist-tag
        run: node -e "const v=require('./package.json').version; process.stdout.write('tag=' + (v.includes('-') ? 'next' : 'latest') + '\n')" >> "$GITHUB_OUTPUT"
      - name: Publish
        run: npm publish --provenance --access public --tag ${{ steps.dist-tag.outputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
